{% extends 'base.html' %}
{% block title %}Deactivate Member{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto mt-20 text-center">
  <div class="w-20 h-20 rounded-full bg-error/10 flex items-center justify-center mx-auto mb-6">
    <span class="material-symbols-outlined text-4xl text-error">warning</span>
  </div>
  <h1 class="text-3xl font-black font-headline tracking-tighter mb-3">Deactivate Member?</h1>
  <p class="text-on-surface-variant mb-8">
    This will set <strong class="text-on-surface">{{ member.get_full_name }}</strong> ({{ member.member_id }}) to Inactive status. No data will be deleted.
  </p>
  <form method="post" class="flex items-center justify-center gap-4">
    {% csrf_token %}
    <a href="{% url 'member_detail' member.pk %}" class="px-6 py-3 rounded-xl border border-outline-variant/30 text-on-surface-variant hover:text-white font-bold uppercase tracking-widest transition-colors">Cancel</a>
    <button type="submit" class="px-6 py-3 bg-error text-white rounded-xl font-bold uppercase tracking-widest hover:brightness-110 transition-all">Deactivate</button>
  </form>
</div>
{% endblock %}
